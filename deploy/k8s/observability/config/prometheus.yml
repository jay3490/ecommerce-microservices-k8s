# Prometheus scrape configuration shared by Compose and Kubernetes. The services push their
# metrics to the OpenTelemetry Collector over OTLP; Prometheus scrapes the collector.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics (HTTP server/client, runtime, messaging, saga) re-exported by the collector.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own health: received, refused and exported telemetry.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # RabbitMQ's built-in Prometheus plugin: queue depths, including the dead-letter queues.
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
