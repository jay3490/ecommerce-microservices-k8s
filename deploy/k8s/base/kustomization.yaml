apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Application workloads only. PostgreSQL, RabbitMQ and Redis are expected to exist already
# (managed services in prod, in-cluster single instances in the dev overlay), and the
# ecommerce-secrets Secret is created outside of this repository (see secret.example.yaml).

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce
    includeSelectors: false

resources:
  - configmap.yaml
  - network-policy.yaml
  - catalog/deployment.yaml
  - catalog/service.yaml
  - catalog/hpa.yaml
  - catalog/pdb.yaml
  - ordering/deployment.yaml
  - ordering/service.yaml
  - ordering/hpa.yaml
  - ordering/pdb.yaml
  - inventory/deployment.yaml
  - inventory/service.yaml
  - inventory/hpa.yaml
  - inventory/pdb.yaml
  - payment/deployment.yaml
  - payment/service.yaml
  - payment/hpa.yaml
  - payment/pdb.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - gateway/hpa.yaml
  - gateway/pdb.yaml
  - gateway/ingress.yaml
