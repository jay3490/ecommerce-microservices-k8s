# Template only: NOT referenced by kustomization.yaml. Create the real Secret out of band,
# for example from a secret manager (the Terraform example stores these in Key Vault) or with:
#
#   kubectl -n <namespace> create secret generic ecommerce-secrets \
#     --from-literal=catalog-db='Host=...;Database=catalog;Username=...;Password=...' \
#     --from-file=identity-signing-key=identity-signing-key.pem \
#     ...
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
type: Opaque
stringData:
  catalog-db: "Host=<postgres-host>;Port=5432;Database=catalog;Username=<user>;Password=<password>;SSL Mode=Require"
  ordering-db: "Host=<postgres-host>;Port=5432;Database=ordering;Username=<user>;Password=<password>;SSL Mode=Require"
  inventory-db: "Host=<postgres-host>;Port=5432;Database=inventory;Username=<user>;Password=<password>;SSL Mode=Require"
  payment-db: "Host=<postgres-host>;Port=5432;Database=payment;Username=<user>;Password=<password>;SSL Mode=Require"
  identity-db: "Host=<postgres-host>;Port=5432;Database=identity;Username=<user>;Password=<password>;SSL Mode=Require"
  shipping-db: "Host=<postgres-host>;Port=5432;Database=shipping;Username=<user>;Password=<password>;SSL Mode=Require"
  notification-db: "Host=<postgres-host>;Port=5432;Database=notification;Username=<user>;Password=<password>;SSL Mode=Require"
  reviews-db: "mongodb://<user>:<password>@<mongo-host>:27017/?tls=true"
  redis: "<redis-host>:6380,password=<password>,ssl=True"
  rabbitmq-username: "<user>"
  rabbitmq-password: "<password>"
  # RSA private key (PEM, 2048 bits or more) that signs access tokens; the same key on every
  # identity-api replica. For example: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072
  identity-signing-key: "<PEM>"
  # Only needed when the gateway also accepts locally signed dev tokens.
  jwt-signing-key: "<at-least-32-random-characters>"
