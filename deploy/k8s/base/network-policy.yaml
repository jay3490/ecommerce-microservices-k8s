# The services trust the X-Customer-Id header set by the gateway, so only the gateway may
# call them; the catalog also answers price lookups from ordering, basket and reviews.
# Requires a CNI that enforces policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-gateway
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - ordering-api
          - inventory-api
          - payment-api
          - identity-api
          - basket-api
          - shipping-api
          - reviews-api
          - notification-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-from-gateway-and-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [gateway, ordering-api, basket-api, reviews-api]
      ports:
        - port: http
