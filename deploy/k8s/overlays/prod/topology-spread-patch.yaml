# Applied to every Deployment. matchLabelKeys narrows the selector to the pod's own
# app.kubernetes.io/name, so each workload is spread independently (Kubernetes 1.27+).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: Exists
          matchLabelKeys:
            - app.kubernetes.io/name
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: Exists
          matchLabelKeys:
            - app.kubernetes.io/name
